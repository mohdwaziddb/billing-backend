server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.jwt.secret=${JWT_SECRET}

# Separate key for AES-GCM provider secrets. Set APP_ENCRYPTION_SECRET in prod
# to a different 32+ char value. Falls back to JWT secret only for backwards
# compatibility with existing deployments (rotation recommended).
app.encryption.secret=${APP_ENCRYPTION_SECRET:${JWT_SECRET}}

app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL},https://*.biziotechnologies.com,https://biziotechnologies.com}
app.reminder.mock-mode=${REMINDER_MOCK_MODE:false}
