server.port=9009
spring.datasource.url=jdbc:mysql://localhost:3306/billing?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Local-only dummy secret. NEVER use this value in prod.
# Real prod secrets come from JWT_SECRET / APP_ENCRYPTION_SECRET env vars.
app.jwt.secret=${JWT_SECRET:local-dev-only-dummy-secret-min-32-chars-000000}
app.encryption.secret=${APP_ENCRYPTION_SECRET:${app.jwt.secret}}
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://*.localhost:5173
app.reminder.mock-mode=true
