spring.application.name=billing
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
app.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Spring AI configuration (works with any OpenAI-compatible provider).
# Defaults point to the local Ollama server via its OpenAI-compatible API.
# Ollama ignores the API key, so a placeholder is used. For real providers
# (OpenAI, DeepSeek, etc.) set SPRING_AI_OPENAI_API_KEY to the actual key.
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:ollama-placeholder}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://ai-server.edubac.com/ollama}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_MODEL:qwen3:8b}
spring.ai.openai.chat.options.temperature=${SPRING_AI_OPENAI_TEMPERATURE:0.7}
spring.ai.openai.chat.options.max-tokens=${SPRING_AI_OPENAI_MAX_TOKENS:2048}